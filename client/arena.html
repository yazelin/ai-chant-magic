<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>等待開播｜咏唱魔法</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #100d0b; --gold: #d6b26e; --gold-hi: #f6dea6; --txt: #eee8dc; --dim: #a69a88;
      --glass: rgba(16, 13, 11, .78); --line: rgba(214, 178, 110, .45);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--txt);
      font-family: 'Noto Sans TC', system-ui, sans-serif; }
    #game { position: fixed; inset: 0; }
    .serif { font-family: 'Noto Serif TC', serif; }
    .card { position: fixed; background: var(--glass); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,.5), inset 0 0 0 4px rgba(16,13,11,.6), inset 0 0 0 5px rgba(214,178,110,.18);
      backdrop-filter: blur(6px); }

    /* 倒數：上方置中 */
    #count { top: 2.2vh; left: 50%; transform: translateX(-50%); padding: 1.2vh 2.6vw 1.4vh; text-align: center; min-width: 30vw; }
    #count .label { font-size: 1.5vh; letter-spacing: .5em; color: var(--gold); }
    #count .time { font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 7.4vh; line-height: 1.1;
      background: linear-gradient(var(--gold-hi), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent;
      font-variant-numeric: tabular-nums; letter-spacing: .04em; }
    #count .sub { font-size: 1.8vh; color: var(--dim); letter-spacing: .12em; }

    /* QR：右上 */
    #join { top: 2.2vh; right: 1.4vw; padding: 1.6vh; width: 21vh; text-align: center; }
    #qr { background: #fff; border-radius: 8px; padding: 1vh; line-height: 0; }
    #qr img, #qr svg { width: 100%; height: auto; }
    #join .t { font-family: 'Noto Serif TC', serif; font-weight: 700; color: var(--gold-hi); font-size: 2.1vh; margin: 1.2vh 0 .4vh; letter-spacing: .1em; }
    #join .d { font-size: 1.45vh; color: var(--dim); line-height: 1.5; }
    #join .n { margin-top: .8vh; font-size: 1.6vh; color: var(--gold); }

    /* 輪播卡：左下 */
    #info { left: 1.4vw; bottom: 2.2vh; width: 34vw; max-width: 620px; padding: 2vh 2.2vh; min-height: 18vh; }
    #info .slide { display: none; gap: 2vh; align-items: center; animation: fade .8s ease; }
    #info .slide.on { display: flex; }
    #info img.cover { width: 14vh; height: 14vh; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); flex: none; }
    #info img.avatar { width: 10vh; height: 10vh; border-radius: 50%; border: 2px solid var(--gold); flex: none; }
    #info .k { font-size: 1.4vh; color: var(--gold); letter-spacing: .3em; }
    #info h2 { margin: .3vh 0 .6vh; font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 3.6vh; color: var(--gold-hi); letter-spacing: .06em; }
    #info p { margin: 0; font-size: 1.75vh; line-height: 1.6; color: var(--txt); }
    #info ol { margin: .4vh 0 0; padding-left: 1.3em; font-size: 1.75vh; line-height: 1.65; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* 戰況：右下 */
    #stat { right: 1.4vw; bottom: 2.2vh; padding: 1.4vh 1.8vh; font-size: 1.7vh; color: var(--dim); line-height: 1.6; width: 21vh; min-width: 220px; }
    #stat b { color: var(--gold-hi); font-family: 'Noto Serif TC', serif; font-size: 2.2vh; }
    #stat .stage { color: var(--gold-hi); font-size: 2.4vh; font-weight: 700; }
    #stat .best { color: var(--gold); font-size: 1.5vh; }
    #stat .wipe { color: #ffb4a0; }
    #stat .k { margin-top: .8vh; padding-top: .8vh; border-top: 1px solid var(--line); color: var(--gold); letter-spacing: .3em; font-size: 1.4vh; }
    #stat ol { margin: .3vh 0 0; padding-left: 1.4em; }
    #stat li { display: flex; justify-content: space-between; gap: 1vh; color: var(--txt); }
    #stat li::marker { color: var(--gold); }
    #stat li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #stat li b { font-size: 1.8vh; }

    /* 沒人時場地中央的提示 */
    #empty { position: fixed; left: 50%; top: 52%; transform: translate(-50%, -50%); text-align: center; pointer-events: none;
      font-family: 'Noto Serif TC', serif; color: var(--gold-hi); text-shadow: 0 2px 18px #000; }
    #empty .a { font-size: 4.6vh; font-weight: 900; letter-spacing: .2em; }
    #empty .b { font-size: 2vh; color: var(--txt); margin-top: 1vh; letter-spacing: .1em; }

    /* 開始遮罩：瀏覽器要一次點擊才能出聲 */
    #gate { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,6,5,.86); z-index: 10; cursor: pointer; text-align: center; }
    #gate .a { font-family: 'Noto Serif TC', serif; font-size: 4vh; color: var(--gold-hi); }
    #gate .b { color: var(--dim); margin-top: 1.2vh; font-size: 1.8vh; line-height: 1.8; }
    #busy { position: fixed; inset: 0; display: none; place-items: center; background: rgba(8,6,5,.94); z-index: 20; text-align: center; }
    #busy .a { font-family: 'Noto Serif TC', serif; font-size: 3.6vh; color: var(--gold-hi); }
    #busy .b { color: var(--dim); margin: 1.4vh 0 2.4vh; font-size: 1.8vh; line-height: 1.8; }
    #busy button { font: inherit; font-size: 1.9vh; padding: 1.2vh 2.4vh; border-radius: 10px; border: 1px solid var(--gold); background: transparent; color: var(--gold-hi); cursor: pointer; }
    /* 大招條幅：橫過畫面中段，職業顏色 */
    #ult { position: fixed; left: 0; right: 0; top: 40%; transform: translateY(-50%); pointer-events: none; z-index: 6;
      text-align: center; padding: 1.4vh 0 1.8vh; opacity: 0;
      background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--c, #d6b26e) 55%, #100d0b) 18%, color-mix(in srgb, var(--c, #d6b26e) 70%, #100d0b) 50%, color-mix(in srgb, var(--c, #d6b26e) 55%, #100d0b) 82%, transparent);
      border-top: 1px solid color-mix(in srgb, var(--c, #d6b26e) 80%, #fff); border-bottom: 1px solid color-mix(in srgb, var(--c, #d6b26e) 80%, #fff); }
    #ult .who { font-size: 2.2vh; color: #fff; letter-spacing: .3em; text-shadow: 0 1px 6px #000; }
    #ult .what { font-family: 'Noto Serif TC', serif; font-weight: 900; font-size: 7vh; line-height: 1.1; color: #fff; letter-spacing: .12em;
      text-shadow: 0 0 18px var(--c, #d6b26e), 0 3px 10px #000; }
    #ult .x { font-size: 4.4vh; margin-left: .4em; color: var(--gold-hi); }
    #ult.go { animation: ult 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes ult {
      0% { opacity: 0; transform: translate(-30%, -50%) skewX(-12deg); }
      14% { opacity: 1; transform: translate(0, -50%) skewX(0); }
      78% { opacity: 1; transform: translate(0, -50%); }
      100% { opacity: 0; transform: translate(24%, -50%); }
    }
    #toast { position: fixed; left: 50%; top: 17vh; transform: translateX(-50%); font-family: 'Noto Serif TC', serif; font-size: 2.4vh;
      color: var(--gold-hi); text-shadow: 0 2px 12px #000; pointer-events: none; transition: opacity .6s; opacity: 0; }
    #err { position: fixed; left: 1.4vw; top: 2.2vh; font-size: 1.5vh; color: #ffb4a0; text-shadow: 0 1px 6px #000; }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="count" class="card">
    <div class="label">直播倒數</div>
    <div class="time" id="clock">--:--</div>
    <div class="sub" id="countsub">21:00 開始</div>
  </div>

  <div id="join" class="card">
    <div id="qr"></div>
    <div class="t">掃碼一起打魔物</div>
    <div class="d">手機當手把<br>喊招式名也能施法</div>
    <div class="n" id="n">目前 0 位勇者</div>
  </div>

  <div id="info" class="card"></div>
  <div id="stat" class="card"></div>
  <div id="empty"><div class="a">等待勇者集結</div><div class="b">掃右上角的 QR Code 加入</div></div>
  <div id="ult"></div>
  <div id="toast"></div>
  <div id="err"></div>

  <div id="busy">
    <div>
      <div class="a"></div>
      <div class="b">同一個房間只能有一個主畫面。直播請用原本那一頁；<br>確定要改用這一頁，按下面的按鈕，原本那頁會停下來。</div>
      <button id="takeover">改由這一頁接手</button>
    </div>
  </div>

  <div id="gate">
    <div>
      <div class="a">點一下開始</div>
      <div class="b">開始後瀏覽器才能播放音效<br>M 全部靜音　B 背景音樂開關　F 全螢幕</div>
    </div>
  </div>

  <script src="./vendor/qrcode.js"></script>
  <script type="module" src="/src/arena/arena.ts"></script>
</body>
</html>
